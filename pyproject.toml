[project]
name = "thesis"
version = "0.1.0"
description = "MSc thesis (UiA): Norwegian sentiment classification on NoReC — fine-tuning vs prompting with open-source language models"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.5",
    "transformers>=4.45",
    "datasets>=3.0",
    "accelerate>=1.0",
    "scikit-learn>=1.5",
    "numpy>=2.0,<3.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["thesis"]
